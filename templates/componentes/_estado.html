{# Etiqueta Activa / Inactiva de una cuenta #}
{% if cuenta.activa %}
    <span class="badge rounded-pill text-bg-success-subtle text-success-emphasis border border-success-subtle">Activa</span>
{% else %}
    <span class="badge rounded-pill text-bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle">Inactiva</span>
{% endif %}
