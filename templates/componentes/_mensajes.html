{# Avisos que dejan las vistas (éxito, error...); Bootstrap llama "danger" al error #}
{% if messages %}
    {% for mensaje in messages %}
        <div class="alert alert-{% if mensaje.tags == 'error' %}danger{% else %}{{ mensaje.tags|default:'info' }}{% endif %} alert-dismissible fade show shadow-sm" role="alert">
            {{ mensaje }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
    {% endfor %}
{% endif %}
